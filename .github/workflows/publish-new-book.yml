name: Publish queued books

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - run: ruby bin/publish_queued_books

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No books to publish"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/books.yml _data/queued_books.yml
          git commit -m "Publish queued Austenpunk books"
          git push

