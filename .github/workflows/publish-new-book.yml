name: Publish queued books

on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.40"

      - name: Install Perl dependencies
        run: cpanm --notest --installdeps .

      - name: Extend book queue
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Skipping queue extension: OPENAI_API_KEY is not configured"
            exit 0
          fi

          perl bin/extend_queue || {
            echo "::warning::Queue extension failed"
          }
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Publish queued books
        id: publish
        run: |
          SLUGS=$(perl bin/publish_queued_books | xargs echo)
          echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No books to publish"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/books.yml
          git commit -m "Update queued Austenpunk books"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild site
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run pages.yml
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install ffmpeg
        if: steps.publish.outputs.slugs != ''
        run: sudo apt-get install -y ffmpeg

      - name: Generate videos
        if: steps.publish.outputs.slugs != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          PUBLISHED_SLUGS: ${{ steps.publish.outputs.slugs }}
        run: |
          if [ -z "$OPENAI_API_KEY" ] || [ -z "$ELEVENLABS_API_KEY" ] || [ -z "$ELEVENLABS_VOICE_ID" ]; then
            echo "Skipping video generation: API secrets not configured"
            exit 0
          fi
          for slug in $PUBLISHED_SLUGS; do
            echo "Generating video for: $slug"
            perl bin/mk_video "$slug"
          done

      - name: Set video artifact name
        id: artifact
        if: steps.publish.outputs.slugs != ''
        run: echo "name=video-$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Upload video artifacts
        if: steps.publish.outputs.slugs != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: tmp/
          if-no-files-found: ignore
