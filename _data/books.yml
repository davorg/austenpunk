- slug: wuthering-git
  live: true
  title: "Wuthering Git"
  subtitle: "Branching Strategies Driven Entirely by Revenge"
  author: "Emily Brontë"
  published: 2026-05-24
  topic: "Version Control"
  teaser: >
    Heathcliff's approach to source code management has terrified
    development teams for generations.
  blurb: >
    A storm-lashed guide to Git workflows, force-pushes, unresolved merge
    conflicts, and the terrible consequences of allowing emotional intensity
    into your branching strategy.
  pullquote: >
    “The definitive guide to rebasing when everyone involved is making
    decisions out of spite.”
  contents:
    - "Chapter 1: I Am Come Back to This Repository"
    - "Chapter 2: The Force-Push on the Moor"
    - "Chapter 3: Branches, Ghosts, and Unresolved Conflicts"
    - "Chapter 4: Reader, I Squashed Him"

- slug: pride-prejudice-and-pull-requests
