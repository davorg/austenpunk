  subtitle: "Elizabeth Bennet Navigates Modern Code Review"
  author: "Jane Austen"
  published: 2026-05-25
  topic: "Code Review"
  teaser: >
    Elizabeth Bennet thought first impressions were difficult enough.
    Then she encountered a 4,000-line pull request with no tests.
  blurb: >
