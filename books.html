---
layout: default
title: Books
permalink: /books/
---

{% assign books = site.data.books | where: "live", true | sort: "title" %}

<section class="books-index">
  <h1>Books</h1>

  <ol class="books-list">
    {% for book in books %}
      <li>
        <a href="/books/{{ book.slug }}/">{{ book.title }}</a>
        <span>{{ book.author }} · {{ book.topic }}</span>
      </li>
    {% endfor %}
  </ol>
</section>
